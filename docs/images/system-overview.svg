<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660"
     font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1040" height="660" fill="#fbfcfd"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#263238">F407 四轴步进电机控制系统 — 硬件组成</text>
  <text x="40" y="72" font-size="14" fill="#607d8b">野火 F407 骄阳 + 电机板 · 4 路步进电机，两两同步成两组 · 按键与触摸屏双操作</text>
  <line x1="40" y1="86" x2="1000" y2="86" stroke="#cfd8dc" stroke-width="1.5"/>

  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
  </defs>

  <!-- ============ 左：输入 / 指示 ============ -->
  <g stroke="#37474f" stroke-width="1.6">
    <rect x="40" y="120" width="250" height="150" rx="10" fill="#e8f5e9"/>
    <rect x="40" y="286" width="250" height="112" rx="10" fill="#e3f2fd"/>
    <rect x="40" y="414" width="250" height="96" rx="10" fill="#f5f5f5"/>
  </g>
  <text x="56" y="146" font-size="15" font-weight="700" fill="#1b5e20">物理按键 ×5</text>
  <g font-size="12.5" fill="#37474f" font-family="Consolas, monospace">
    <text x="56" y="172">KEY1  PA0    走一次</text>
    <text x="56" y="194">KEY2  PG2    切换模式</text>
    <text x="56" y="216">KEY3  PC13   切换单位</text>
    <text x="56" y="238">KEY4  PG3    当前单位 −</text>
    <text x="56" y="260">KEY5  PG4    当前单位 +</text>
  </g>
  <text x="56" y="312" font-size="15" font-weight="700" fill="#0d47a1">电阻触摸 XPT2046</text>
  <g font-size="12.5" fill="#37474f">
    <text x="56" y="336">软件模拟 SPI（不走硬件 SPI）</text>
    <text x="56" y="356">CLK=PG9  CS=PH4  MOSI=PD6</text>
    <text x="56" y="376">MISO=PH5  按下中断 PENIRQ=PG8</text>
  </g>
  <text x="56" y="440" font-size="15" font-weight="700" fill="#424242">LED 指示</text>
  <g font-size="12.5" fill="#455a64">
    <text x="56" y="464">LED1（PA15）亮 = 模式 0：电机 1、2</text>
    <text x="56" y="486">LED2（PE2）亮 = 模式 1：电机 3、4</text>
  </g>

  <!-- ============ 中：MCU ============ -->
  <rect x="360" y="120" width="330" height="390" rx="12" fill="#ffffff" stroke="#1565c0" stroke-width="2.2"/>
  <text x="525" y="156" font-size="19" font-weight="700" fill="#0d47a1" text-anchor="middle">STM32F407ZGTx</text>
  <text x="525" y="180" font-size="12.5" fill="#546e7a" text-anchor="middle">SYSCLK 168 MHz（HSE 25 MHz）· APB2 84 MHz</text>
  <line x1="382" y1="194" x2="668" y2="194" stroke="#cfd8dc" stroke-width="1.4"/>

  <g font-size="12.5">
    <rect x="382" y="210" width="286" height="54" rx="8" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="394" y="232" font-weight="700" fill="#0d47a1">TIM8 四通道脉冲输出</text>
    <text x="394" y="252" fill="#455a64" font-family="Consolas, monospace">CH1=PI5  CH2=PI6  CH3=PI7  CH4=PC9</text>

    <rect x="382" y="274" width="286" height="54" rx="8" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="394" y="296" font-weight="700" fill="#0d47a1">梯形加减速状态机</text>
    <text x="394" y="316" fill="#455a64">speed_decision_axis()，每次脉冲决策一次</text>

    <rect x="382" y="338" width="286" height="54" rx="8" fill="#fff8e1" stroke="#ffb300" stroke-width="1.2"/>
    <text x="394" y="360" font-weight="700" fill="#8d6e00">TIM8_CC_IRQHandler（唯一中断源）</text>
    <text x="394" y="380" fill="#6d4c41">脉冲在中断里发，主循环卡顿也不丢步</text>

    <rect x="382" y="402" width="286" height="44" rx="8" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="394" y="430" fill="#4a148c">按键扫描 + 触摸命中 → 同一个 DoAction()</text>

    <rect x="382" y="456" width="286" height="44" rx="8" fill="#e0f2f1" stroke="#90a4ae" stroke-width="1.2"/>
    <text x="394" y="484" fill="#00695c">LCD 界面：距离 / 单位 / 模式 / 状态 / 脉冲</text>
  </g>

  <!-- ============ 右：驱动器 + 电机 ============ -->
  <g stroke="#37474f" stroke-width="1.6">
    <rect x="760" y="120" width="250" height="72" rx="10" fill="#e8f5e9"/>
    <rect x="760" y="200" width="250" height="72" rx="10" fill="#e8f5e9"/>
    <rect x="760" y="280" width="250" height="72" rx="10" fill="#fff3e0"/>
    <rect x="760" y="360" width="250" height="72" rx="10" fill="#fff3e0"/>
  </g>
  <g font-size="14.5" font-weight="700">
    <text x="776" y="146" fill="#1b5e20">电机 1 ｜ 轴1（AXIS_12）</text>
    <text x="776" y="226" fill="#1b5e20">电机 2 ｜ 轴1（AXIS_12）</text>
    <text x="776" y="306" fill="#e65100">电机 3 ｜ 轴2（AXIS_34）</text>
    <text x="776" y="386" fill="#e65100">电机 4 ｜ 轴2（AXIS_34）</text>
  </g>
  <g font-size="12" fill="#37474f" font-family="Consolas, monospace">
    <text x="776" y="170">PUL PI5   DIR PE1   EN PE0</text>
    <text x="776" y="250">PUL PI6   DIR PI8   EN PE4</text>
    <text x="776" y="330">PUL PI7   DIR PI11  EN PI10</text>
    <text x="776" y="410">PUL PC9   DIR PF2   EN PF1</text>
  </g>
  <rect x="760" y="444" width="250" height="66" rx="10" fill="#f5f5f5" stroke="#37474f" stroke-width="1.6"/>
  <text x="776" y="468" font-size="14.5" font-weight="700" fill="#424242">驱动器 ×4 ｜ 32 细分</text>
  <text x="776" y="492" font-size="12.5" fill="#455a64">拨码必须和 MICRO_STEP = 32 一致</text>

  <!-- ============ 连线 ============ -->
  <g stroke="#546e7a" stroke-width="1.8" marker-end="url(#ar3)" fill="none">
    <line x1="292" y1="180" x2="356" y2="180"/>
    <line x1="292" y1="342" x2="356" y2="342"/>
    <line x1="292" y1="462" x2="356" y2="462"/>
    <line x1="692" y1="240" x2="756" y2="156"/>
    <line x1="692" y1="240" x2="756" y2="236"/>
    <line x1="692" y1="240" x2="756" y2="316"/>
    <line x1="692" y1="240" x2="756" y2="396"/>
  </g>
  <g font-size="11.5" fill="#37474f">
    <text x="298" y="173">按键</text>
    <text x="298" y="335">触摸</text>
    <text x="298" y="455">LED</text>
    <text x="700" y="196">PUL / DIR / EN</text>
  </g>

  <!-- ============ 备注 ============ -->
  <rect x="40" y="560" width="970" height="76" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-width="1.3"/>
  <text x="56" y="584" font-size="13" fill="#795548">
    轴1（AXIS_12）里的电机 1、2 由同一套状态机驱动，脉冲在同一个计数点上翻转，所以完全同步；轴2（AXIS_34）同理。
  </text>
  <text x="56" y="606" font-size="13" fill="#795548">
    两个轴互相独立，可以各走各的距离和速度。某个电机方向反了不用改接线：把 bsp_stepper_init.h 里的
  </text>
  <text x="56" y="628" font-size="13" fill="#795548">
    MOTORx_DIR_REVERSE 改成 1 即可，其它代码一行都不用动。
  </text>
</svg>
